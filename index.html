<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>EJ Games</title>
  <meta name="description" content="EJ Games - all our games in one place">
  <meta name="theme-color" content="#0b0820">

  <!-- Installable app (Android + iOS) -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="EJ Games">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0b0820;
      --text: #f2f3ff;
      --muted: #a3a8cc;
      --font: "Poppins", "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: var(--font); color: var(--text); background: var(--bg);
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      overflow-x: hidden;
    }

    /* Moving colour glows */
    .bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
    .blob { position: absolute; border-radius: 50%; filter: blur(80px); opacity: .55; }
    .b1 { width: 70vmax; height: 70vmax; background: #6d28d9; top: -30vmax; left: -25vmax; animation: f1 16s ease-in-out infinite alternate; }
    .b2 { width: 60vmax; height: 60vmax; background: #0ea5e9; bottom: -30vmax; right: -25vmax; animation: f2 20s ease-in-out infinite alternate; }
    .b3 { width: 40vmax; height: 40vmax; background: #f43f5e; top: 40%; left: 30%; opacity: .3; animation: f1 24s ease-in-out infinite alternate-reverse; }
    @keyframes f1 { to { transform: translate(20vw, 15vh) scale(1.15); } }
    @keyframes f2 { to { transform: translate(-20vw, -12vh) scale(.9); } }

    header { text-align: center; padding: 34px 16px 10px; }
    .logo-badge {
      width: 84px; height: 84px; margin: 0 auto 14px; border-radius: 24px;
      display: grid; place-items: center; font-weight: 900; font-size: 36px; letter-spacing: -1px;
      background: linear-gradient(135deg, #ff3d7f, #ff9a3d 55%, #ffe066);
      color: #1a1030; box-shadow: 0 14px 36px rgba(255, 90, 100, .5);
      animation: bob 3s ease-in-out infinite;
    }
    @keyframes bob { 50% { transform: translateY(-6px) rotate(-3deg); } }
    h1 {
      margin: 0; font-size: clamp(40px, 12vw, 72px); font-weight: 900; line-height: 1; letter-spacing: -1px;
      background: linear-gradient(90deg, #fff 0%, #fff 35%, #ffe066 50%, #fff 65%, #fff 100%);
      background-size: 250% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
      animation: shimmer 4s linear infinite;
    }
    h1 span { background: linear-gradient(90deg, #ff3d7f, #ff9a3d, #ffe066); -webkit-background-clip: text; background-clip: text; color: transparent; }
    @keyframes shimmer { from { background-position: 150% 0; } to { background-position: -100% 0; } }
    .sub { margin: 10px 0 0; color: var(--muted); font-weight: 600; font-size: 15px; }

    .grid {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px;
      max-width: 900px; margin: 22px auto 0; padding: 0 18px 40px;
    }
    @media (min-width: 600px) { .grid { grid-template-columns: repeat(3, 1fr); gap: 22px; } }

    .tile {
      position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
      aspect-ratio: 1 / 1; padding: 14px; border-radius: 28px; text-decoration: none; color: #fff; overflow: hidden;
      background: var(--g);
      box-shadow: 0 14px 30px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.35);
      transition: transform .2s cubic-bezier(.2,.9,.3,1.4);
      animation: pop .5s cubic-bezier(.2,.9,.3,1.3) both;
      animation-delay: calc(var(--i) * 60ms);
    }
    @keyframes pop { from { transform: scale(.6); opacity: 0; } }
    .tile::before { /* glossy top */
      content: ""; position: absolute; inset: 0 0 55% 0;
      background: linear-gradient(180deg, rgba(255,255,255,.28), transparent);
    }
    .tile::after { /* moving shine */
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(115deg, transparent 35%, rgba(255,255,255,.35) 50%, transparent 65%);
      background-size: 250% 100%; animation: shimmer 4.5s ease-in-out infinite; animation-delay: calc(var(--i) * 300ms);
    }
    .tile:hover { transform: translateY(-4px) scale(1.03); }
    .tile:active { transform: scale(.94); }
    .icon { font-size: clamp(48px, 15vw, 72px); line-height: 1; filter: drop-shadow(0 6px 10px rgba(0,0,0,.35)); }
    .name { font-weight: 800; font-size: clamp(14px, 4.2vw, 19px); text-align: center; line-height: 1.15; text-shadow: 0 2px 6px rgba(0,0,0,.35); }

    footer { text-align: center; color: var(--muted); font-size: 12px; padding: 0 16px 24px; }
  </style>
</head>
<body>
  <div class="bg"><span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span></div>

  <header>
    <div class="logo-badge">EJ</div>
    <h1>EJ <span>Games</span></h1>
    <p class="sub">Tap a game to play! 🎮</p>
  </header>

  <main class="grid" id="grid"></main>

  <footer>EJ Games</footer>

  <script>
    const GAMES = [
      { name: "Flags",              icon: "🌍", url: "https://vineethjohnabraham.github.io/flags/",                                    g: "linear-gradient(135deg,#22c55e,#0ea5e9)" },
      { name: "Cricket",            icon: "🏏", url: "https://vineethjohnabraham.github.io/games/cricket/",                            g: "linear-gradient(135deg,#16a34a,#84cc16)" },
      { name: "Ping Pong",          icon: "🏓", url: "https://vineethjohnabraham.github.io/games/pingpong-nodejs/index.html",          g: "linear-gradient(135deg,#ef4444,#f97316)" },
      { name: "Tetris",             icon: "🧱", url: "https://vineethjohnabraham.github.io/games/nodejs-testing-tertis/index.html",    g: "linear-gradient(135deg,#8b5cf6,#ec4899)" },
      { name: "Snake",              icon: "🐍", url: "https://vineethjohnabraham.github.io/games/snake-game/snake.html",               g: "linear-gradient(135deg,#10b981,#065f46)" },
      { name: "Pac",                icon: "👾", url: "https://vineethjohnabraham.github.io/games/pacman-nodejs/index.html",            g: "linear-gradient(135deg,#facc15,#f59e0b)" },
      { name: "Turbo Racer",        icon: "🏎️", url: "https://vineethjohnabraham.github.io/games/ladder-nodesjs/index.html",          g: "linear-gradient(135deg,#0ea5e9,#6366f1)" },
      { name: "Cricket Trump Card", icon: "🃏", url: "https://vineethjohnabraham.github.io/cricket_trump_card/",                       g: "linear-gradient(135deg,#ff3d7f,#ff9a3d)" },
      { name: "Snake & Ladder",     icon: "🎲", url: "https://vineethjohnabraham.github.io/games/vintage-snakeladder-nodejs/index.html", g: "linear-gradient(135deg,#a855f7,#3b82f6)" },
    ];

    document.getElementById("grid").innerHTML = GAMES.map((game, i) => `
      <a class="tile" href="${game.url}" style="--g:${game.g};--i:${i}">
        <span class="icon">${game.icon}</span>
        <span class="name">${game.name}</span>
      </a>`).join("");

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
    }
  </script>
</body>
</html>
